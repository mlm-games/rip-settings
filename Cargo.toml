[workspace]
members = ["settings-core", "settings-derive", "settings-example"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["MLM Games"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mlm-games/multiplatform-settings-rs"
description = "Settings handler with derive macros, validation, backup, migration, and pluggable backends"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["sync", "rt", "macros"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"
md5 = "0.8.0"
