[workspace]
members = ["settings-core", "settings-derive", "settings-repose", "settings-example"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
authors = ["MLM Games"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mlm-games/rip-settings"
homepage = "https://github.com/mlm-games/rip-settings"
documentation = "https://docs.rs/rip-settings"
readme = "README.md"
description = "Type-safe settings management for Rust with derive macros, validation, backup, and pluggable backends"
keywords = ["settings", "config", "derive", "serde", "preferences"]
categories = ["config", "rust-patterns"]
exclude = [".github/images/"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["sync", "rt", "macros"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.13"
sha2 = "0.11"
hex = "0.4"
argon2 = "0.6"
rand_core = "0.10"
log = "0.4"
